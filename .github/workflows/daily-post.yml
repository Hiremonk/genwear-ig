name: GenWear Instagram publisher

# Two ways in:
#   1. workflow_dispatch — you trigger it, `now` publishes a specific post.
#   2. the cron below — fires daily at 11:00 IST and publishes ONLY posts whose
#      status is "scheduled" and whose publish_at has arrived. Anything on
#      "hold" is invisible to it, so adding a date is not enough to go live —
#      the status flip is the approval.
# Runs twice, 15 min apart, because GitHub cron can lag. Once a post publishes
# its status becomes "posted" and is committed back, so the second run no-ops.
on:
  schedule:
    - cron: "30 5 * * *"   # 11:00 IST
    - cron: "45 5 * * *"   # 11:15 IST — retry if the first was delayed
    - cron: "30 12 * * *"  # 18:00 IST
    - cron: "45 12 * * *"  # 18:15 IST — retry
  workflow_dispatch:
    inputs:
      now:
        description: "Post ID to publish immediately (blank = whatever is due)"
        required: false
      list:
        description: "Set to 1 to just print the queue"
        required: false
        default: "0"
      dry_run:
        description: "Set to 1 to preview without publishing"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: genwear-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "${{ github.event.inputs.list }}" = "1" ]; then
            python publish.py --list
          elif [ -n "${{ github.event.inputs.now }}" ]; then
            python publish.py --now "${{ github.event.inputs.now }}"
          else
            python publish.py
          fi

      - name: Commit queue state
        run: |
          if [ -n "$(git status --porcelain queue.json)" ]; then
            git config user.name "genwear-bot"
            git config user.email "actions@github.com"
            git add queue.json
            git commit -m "publish: update queue state [skip ci]"
            git push
          else
            echo "queue.json unchanged"
          fi
